identity:
  name: add_trace
  author: charles
  label:
    en_US: Add Trace
    zh_Hans: 添加溯源
description:
  human:
    en_US: Add a trace (attribution) task for a tenant. Checks the existing trace status first; if a trace is already running or completed it returns the existing record, otherwise it starts one (status running), which hands the task to the trace workflow and notifies the tracer on duty.
    zh_Hans: 为租户添加溯源任务。先查询画像里的溯源状态：若已在溯源中或已完成，则返回已有溯源记录；否则发起溯源（状态置为 running/溯源中），任务会下发到溯源流程并通知值班溯源专员。
  llm: Add a trace (attribution) task for a tenant identified by its tenant name. The tool first reads the entity profile's trace status; if the tenant is already being traced (running) or the trace is complete, it returns the existing trace record without re-adding. Otherwise it starts a new trace, which dispatches the task and notifies the tracer on duty. A clue is required and is included in that notice. Only tenant names are supported. Returns only the resulting trace status, never the profile; call query_entity_profile if you need to read the profile back.
parameters:
  - name: object_name
    type: string
    required: true
    label:
      en_US: Tenant Name
      zh_Hans: 租户名
    human_description:
      en_US: The tenant name to add a trace task for. This endpoint currently only supports tenant names.
      zh_Hans: 要添加溯源的租户名。该接口目前仅支持传入租户名。
    llm_description: The tenant name identifying the tenant to add a trace task to. Must be a tenant name.
    form: llm

  - name: clue
    type: string
    required: true
    label:
      en_US: Clue
      zh_Hans: 租户线索
    human_description:
      en_US: The clue about the tenant, passed to the trace workflow and shown to the tracer on duty in the trace-start notice. Required — a trace with no clue gives the tracer nothing to work from.
      zh_Hans: 租户线索，会随溯源任务下发，并出现在发给值班溯源专员的通知里（“租户线索”一栏）。必填——没有线索的溯源任务专员无从下手。
    llm_description: A short clue stating why this tenant is being traced and what is known about the attacker (e.g. the attack source IP, the alert or behaviour that triggered it). Required — it is dispatched with the trace task and is the only context the tracer on duty receives, so summarise the actual finding rather than restating the tenant name.
    form: llm

extra:
  python:
    source: tools/add_trace.py
