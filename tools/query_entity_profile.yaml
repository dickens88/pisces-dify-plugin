identity:
  name: query_entity_profile
  author: charles
  label:
    en_US: Query Entity Profile
    zh_Hans: 查询实体画像
description:
  human:
    en_US: Query the entity profile (portrait) for a single entity by its object name, or list/search entity profiles when object_name is omitted. A tenant may also be looked up by its domain id.
    zh_Hans: 根据实体名称（object_name）查询该实体的画像信息；租户也可以直接用 domainid 查询。不填 object_name 时改为列表搜索，可按是否添加盯防等条件过滤。
  llm: Query entity profiles. If object_name is given, returns the full profile document for that single entity (basic info, tenant tags, monitoring/trace state and recent related alerts). Tenant profiles are keyed by the tenant name, but a domain id or a partial name also works — it is resolved through the same keyword search the console's search box uses, and the answer names the entity it resolved to. When the input matches several entities their names are listed instead, so retry with one of them. If object_name is omitted, lists/searches profiles instead — use the monitoring filter to narrow the list to entities that do (or do not) have the monitoring flag, and attacker_only to narrow it to entities tagged as attackers; leaving a filter unset applies no constraint on that dimension. The two filters can be combined, e.g. monitored attackers.
parameters:
  - name: object_name
    type: string
    required: false
    label:
      en_US: Object Name
      zh_Hans: 实体名称
    human_description:
      en_US: The entity to query, e.g. a tenant name, a tenant domain id or an IP address. A domain id or a partial tenant name is resolved to the tenant automatically. Leave empty to list/search profiles instead.
      zh_Hans: 要查询的实体，例如租户名、租户 domainid 或 IP 地址。传 domainid 或租户名的一部分时会自动解析到对应租户。留空则改为列表搜索多个实体。
    llm_description: The entity to look up — a tenant name, a tenant domain id, or an IP address. An exact object name is matched first; a domain id or partial name falls back to keyword search and resolves to the matching entity. Omit this to search/list multiple entity profiles instead of fetching one.
    form: llm

  - name: monitoring
    type: boolean
    required: false
    label:
      en_US: Monitoring Only
      zh_Hans: 仅盯防
    human_description:
      en_US: Only used when object_name is omitted (list mode). Set true to return only entities with the monitoring flag added, false to return only entities without it. Leave unset to return all entities regardless of monitoring state.
      zh_Hans: 仅在不填 object_name（列表模式）时生效。设为 true 只返回已添加盯防的实体，设为 false 只返回未添加盯防的实体，不填则返回全部（不按盯防状态过滤）。
    llm_description: List-mode only filter. true = only monitored entities, false = only non-monitored entities, omitted = no filter on monitoring state (all entities).
    form: llm

  - name: attacker_only
    type: boolean
    required: false
    label:
      en_US: Attackers Only
      zh_Hans: 仅攻击者
    human_description:
      en_US: Only used when object_name is omitted (list mode). Set true to return only entities tagged as attackers (security_tag=attack). Leave unset to return all entities regardless of security tag.
      zh_Hans: 仅在不填 object_name（列表模式）时生效。设为 true 只返回被标记为攻击者的实体（security_tag=attack），不填则返回全部（不按安全标记过滤）。
    llm_description: "List-mode only filter. true = only entities whose security_tag is \"attack\" (attackers). Omitted or false = no filter on security_tag. Note this is a switch, not a tri-state: false does not mean \"non-attackers\", it simply applies no filter. Can be combined with the monitoring filter."
    form: llm

  - name: limit
    type: number
    required: false
    label:
      en_US: Page Size
      zh_Hans: 每页数量
    human_description:
      en_US: Only used in list mode (object_name omitted). Maximum number of records to return (default 50).
      zh_Hans: 仅在列表模式（不填 object_name）时生效。每页返回的最大记录数（默认 50）。
    llm_description: List-mode only. Number of records per page, default 50.
    form: llm
    default: 50

  - name: offset
    type: number
    required: false
    label:
      en_US: Offset
      zh_Hans: 分页偏移
    human_description:
      en_US: Only used in list mode (object_name omitted). Number of records to skip for pagination (default 0).
      zh_Hans: 仅在列表模式（不填 object_name）时生效。分页偏移量（默认 0）。
    llm_description: List-mode only. Offset for pagination, default 0.
    form: llm
    default: 0

extra:
  python:
    source: tools/query_entity_profile.py
